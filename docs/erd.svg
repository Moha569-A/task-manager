<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#101828" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="880" height="470" fill="#f6f7fb"/>
  <text x="440" y="42" text-anchor="middle" font-size="20" font-weight="800" fill="#101828">TaskFlow — database schema</text>

  <!-- users table -->
  <g filter="url(#sh)">
    <rect x="70" y="80" width="300" height="248" rx="12" fill="#ffffff" stroke="#e6e8f0"/>
    <path d="M70 92 a12 12 0 0 1 12-12 h276 a12 12 0 0 1 12 12 v28 h-300 z" fill="url(#hdr)"/>
    <text x="220" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">users</text>
  </g>
  <g font-size="13" fill="#101828">
    <text x="90" y="146" font-family="ui-monospace, Menlo, Consolas, monospace">id</text>
    <text x="230" y="146" fill="#6b7280">INTEGER</text>
    <text x="330" y="146" text-anchor="end" font-size="11" font-weight="700" fill="#7c3aed">PK</text>

    <text x="90" y="176" font-family="ui-monospace, Menlo, Consolas, monospace">email</text>
    <text x="230" y="176" fill="#6b7280">VARCHAR(255)</text>
    <text x="330" y="176" text-anchor="end" font-size="11" font-weight="700" fill="#2563eb">UQ</text>

    <text x="90" y="206" font-family="ui-monospace, Menlo, Consolas, monospace">full_name</text>
    <text x="230" y="206" fill="#6b7280">VARCHAR(120)</text>

    <text x="90" y="236" font-family="ui-monospace, Menlo, Consolas, monospace">password_hash</text>
    <text x="230" y="236" fill="#6b7280">VARCHAR(255)</text>

    <text x="90" y="266" font-family="ui-monospace, Menlo, Consolas, monospace">created_at</text>
    <text x="230" y="266" fill="#6b7280">DATETIME(tz)</text>

    <line x1="86" y1="286" x2="354" y2="286" stroke="#eef0f6"/>
    <text x="90" y="310" font-size="11.5" fill="#98a1b3">password stored as PBKDF2-HMAC-SHA256</text>
  </g>

  <!-- tasks table -->
  <g filter="url(#sh)">
    <rect x="530" y="66" width="300" height="360" rx="12" fill="#ffffff" stroke="#e6e8f0"/>
    <path d="M530 78 a12 12 0 0 1 12-12 h276 a12 12 0 0 1 12 12 v28 h-300 z" fill="url(#hdr)"/>
    <text x="680" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">tasks</text>
  </g>
  <g font-size="13" fill="#101828">
    <text x="550" y="132" font-family="ui-monospace, Menlo, Consolas, monospace">id</text>
    <text x="690" y="132" fill="#6b7280">INTEGER</text>
    <text x="790" y="132" text-anchor="end" font-size="11" font-weight="700" fill="#7c3aed">PK</text>

    <text x="550" y="162" font-family="ui-monospace, Menlo, Consolas, monospace">user_id</text>
    <text x="690" y="162" fill="#6b7280">INTEGER</text>
    <text x="790" y="162" text-anchor="end" font-size="11" font-weight="700" fill="#dc2626">FK</text>

    <text x="550" y="192" font-family="ui-monospace, Menlo, Consolas, monospace">title</text>
    <text x="690" y="192" fill="#6b7280">VARCHAR(200)</text>

    <text x="550" y="222" font-family="ui-monospace, Menlo, Consolas, monospace">description</text>
    <text x="690" y="222" fill="#6b7280">TEXT · null</text>

    <text x="550" y="252" font-family="ui-monospace, Menlo, Consolas, monospace">status</text>
    <text x="690" y="252" fill="#6b7280">VARCHAR(20)</text>

    <text x="550" y="282" font-family="ui-monospace, Menlo, Consolas, monospace">priority</text>
    <text x="690" y="282" fill="#6b7280">VARCHAR(10)</text>

    <text x="550" y="312" font-family="ui-monospace, Menlo, Consolas, monospace">due_date</text>
    <text x="690" y="312" fill="#6b7280">DATE · null</text>

    <text x="550" y="342" font-family="ui-monospace, Menlo, Consolas, monospace">completed_at</text>
    <text x="690" y="342" fill="#6b7280">DATETIME · null</text>

    <text x="550" y="372" font-family="ui-monospace, Menlo, Consolas, monospace">created_at</text>
    <text x="690" y="372" fill="#6b7280">DATETIME(tz)</text>

    <text x="550" y="402" font-family="ui-monospace, Menlo, Consolas, monospace">updated_at</text>
    <text x="690" y="402" fill="#6b7280">DATETIME(tz)</text>
  </g>

  <!-- relationship 1 to many -->
  <path d="M370 160 H 450 V 162 H 530" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="370" cy="160" r="4" fill="#7c3aed"/>
  <text x="392" y="150" font-size="13" font-weight="700" fill="#7c3aed">1</text>
  <!-- crow's foot -->
  <path d="M530 162 L 508 150 M530 162 L 508 162 M530 162 L 508 174" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="145" font-size="13" font-weight="700" fill="#7c3aed">*</text>
  <text x="450" y="196" text-anchor="middle" font-size="12" fill="#5b6472">owns</text>

  <!-- constraint legend -->
  <g font-size="12" fill="#5b6472">
    <rect x="70" y="368" width="300" height="66" rx="10" fill="#ffffff" stroke="#e6e8f0"/>
    <text x="88" y="392" font-weight="700" fill="#101828">CHECK constraints</text>
    <text x="88" y="412" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7280">status ∈ pending · in_progress · completed</text>
    <text x="88" y="428" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b7280">priority ∈ low · medium · high · urgent</text>
  </g>
  <text x="440" y="456" text-anchor="middle" font-size="11.5" fill="#98a1b3">FK tasks.user_id → users.id ON DELETE CASCADE · index (user_id, status)</text>
</svg>
